name = "medprep"
main = "index.js"
compatibility_date = "2026-11-23"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/acces/*"]

[[d1_databases]]
binding = "DB"
database_name = "medprep-db"
database_id = "dfc3a0ad-c4fa-4d96-b85a-e86dfa848536"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "medprep-files"
